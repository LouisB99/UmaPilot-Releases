name: Publish signed UmaPilot update
on:
  push:
    branches: [main]
    paths: ['channel/publish.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish the committed, pre-signed application files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/$GH_REPO/$RELEASE_COMMIT"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$base/channel/publish.json" -o publish.json
          version=$(python3 -c 'import json; print(json.load(open("publish.json"))["version"])')
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version'; exit 1; }
          for file in application.zip manifest.json update.json UmaPilot-Enable-Updates.zip notes.md; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$base/releases/$version/$file" -o "$file"
          done
          python3 - <<'PY'
          import hashlib,json
          expected=json.load(open('publish.json'))['sha256']
          for name,value in expected.items():
              assert name in ('application.zip','manifest.json','update.json','UmaPilot-Enable-Updates.zip','notes.md')
              assert hashlib.sha256(open(name,'rb').read()).hexdigest()==value, name+' failed checksum verification'
          assert set(expected)=={'application.zip','manifest.json','update.json','UmaPilot-Enable-Updates.zip','notes.md'}
          PY
          if gh release view "$version" --json isDraft --jq '.isDraft' > existing.txt 2>/dev/null; then
            if [ "$(cat existing.txt)" = false ]; then
              echo 'This release is already published; immutable releases are never replaced.'
              exit 1
            fi
          else
            gh release create "$version" --target "$RELEASE_COMMIT" --title "UmaPilot $version" --notes-file notes.md --draft
          fi
          gh release upload "$version" application.zip manifest.json update.json UmaPilot-Enable-Updates.zip --clobber
          gh release edit "$version" --draft=false --latest
